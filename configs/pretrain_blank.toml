# Two-phase training, phase 1: pretrain on unlabeled SMILES with empty property slots.
# Phase 2: configs/finetune.toml.
#   python scripts/train_conditional.py --config configs/pretrain_blank.toml

[data]
smiles_file   = "data/October2024_cleaned_chembl_smiles_USA300_preds_LogP_TPSA_MW.csv"   # replace with your unlabeled corpus
smiles_column = "SMILES"
output_model  = "models/pretrained_blank.ckpt"

[conditioning]
blank_conditioning = 1    # must equal the number of property columns in finetune.toml

[model]
layer_size    = 512
num_layers    = 3
cell_type     = "gru"
embedding_size = 256
dropout        = 0.0
max_sequence_length = 256

condition_embedding_size = 256
property_embedder_layers = 4
scaffold_embedder_layers = 3

[training]
num_epochs    = 50
batch_size    = 128
learning_rate = 1e-4
lr_step       = 10
lr_gamma      = 0.5
clip_grad     = 1.0
randomize_smiles = true
patience     = 10
es_threshold = 0.01
sample_every = 5
sample_size  = 128
save_every   = 10
device       = "auto"
